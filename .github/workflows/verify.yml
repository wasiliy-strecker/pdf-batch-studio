name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify all modules
        run: xvfb-run -a ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build container image
        run: docker build -f infrastructure/Dockerfile -t pdf-batch-studio:test .
