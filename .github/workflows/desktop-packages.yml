name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $wix) { throw "WiX Toolset installation was not found" }
          Join-Path $wix.FullName "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and smoke-test EXE
        shell: pwsh
        run: ./scripts/package-desktop.ps1 -PackageType exe
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-batch-desktop-windows-x64
          path: desktop/pdf-batch-desktop/target/desktop-dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and smoke-test DMG
        run: ./scripts/package-desktop.sh dmg
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-batch-desktop-macos-${{ matrix.architecture }}
          path: desktop/pdf-batch-desktop/target/desktop-dist/*.dmg
          if-no-files-found: error
